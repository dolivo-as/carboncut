# Bygger og publiserer testsiden (web/) til GitHub Pages på egendomene carboncut.no.
# Merk: Filen gjør ingenting før den ligger i et GitHub-repo og Pages er satt til "GitHub Actions" i repo-innstillingene.
name: Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            calc/package-lock.json
            web/package-lock.json
      - name: Test beregningsmodulen
        working-directory: calc
        run: |
          npm ci
          npm run typecheck
          npm test
      - name: Bygg nettsiden
        working-directory: web
        run: |
          npm ci
          npm run build
      - name: Sjekk at CNAME ligger i dist
        run: test "$(cat web/dist/CNAME)" = "carboncut.no"
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: web/dist   # inkluderer CNAME (kopiert fra web/public/CNAME)

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4

<!doctype html>
<html lang="nb" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="light dark">
<title>Carboncut – skisser v1 (klikkbar prototype)</title>
<style>
:root{
  --bg:#f8fafc; --card:#ffffff; --fg:#0f172a; --muted:#475569; --border:#64748b; --edge:#cbd5e1;
  --primary:#065f46; --primary-fg:#ffffff; --primary-soft:#d1fae5; --primary-soft-fg:#064e3b;
  --warn-bg:#fef3c7; --warn-fg:#78350f; --warn-edge:#b45309;
  --bad:#b91c1c; --bad-bg:#fee2e2; --bad-fg:#7f1d1d;
  --good:#065f46; --bar-you:#065f46; --bar-ref:#475569;
  --banner-bg:#fbbf24; --banner-fg:#451a03; --focus:#1d4ed8; --shadow:0 1px 2px rgba(15,23,42,.08);
  --radius:12px;
}
:root[data-theme="dark"]{
  --bg:#0b1220; --card:#121c2f; --fg:#f1f5f9; --muted:#cbd5e1; --border:#8294ad; --edge:#33425c;
  --primary:#34d399; --primary-fg:#022c22; --primary-soft:#0b4a39; --primary-soft-fg:#d1fae5;
  --warn-bg:#3b2a07; --warn-fg:#fde68a; --warn-edge:#d97706;
  --bad:#fca5a5; --bad-bg:#4a1717; --bad-fg:#fecaca;
  --good:#6ee7b7; --bar-you:#34d399; --bar-ref:#94a3b8;
  --focus:#93c5fd; --shadow:none;
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--fg);font:17px/1.45 ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif}
button,input,select{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--focus);outline-offset:2px}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.shell{max-width:560px;margin:0 auto;min-height:100vh;display:flex;flex-direction:column;background:var(--bg)}
.banner{background:var(--banner-bg);color:var(--banner-fg);padding:10px 14px;text-align:center;font-weight:700;font-size:15px;line-height:1.3}
.appbar{display:flex;align-items:center;gap:8px;padding:8px 12px;border-bottom:1px solid var(--edge);background:var(--card)}
.brand{flex:1;font-size:21px;font-weight:800;letter-spacing:-.01em;display:flex;align-items:center;gap:8px}
.brand svg{color:var(--primary)}
.seg{display:inline-flex;border:2px solid var(--border);border-radius:10px;overflow:hidden}
.seg button{min-width:48px;min-height:48px;padding:0 10px;background:transparent;border:0;font-weight:700;font-size:15px;cursor:pointer}
.seg button[aria-pressed="true"]{background:var(--primary);color:var(--primary-fg)}
.iconbtn{min-width:48px;min-height:48px;border:2px solid var(--border);border-radius:10px;background:transparent;display:inline-flex;align-items:center;justify-content:center;gap:6px;cursor:pointer;font-weight:700;font-size:15px;padding:0 8px}
main{flex:1;padding:16px 16px 120px}
h1{font-size:26px;line-height:1.2;margin:4px 0 6px;letter-spacing:-.01em}
h2{font-size:19px;margin:0 0 8px}
h3{font-size:16px;margin:18px 0 8px;color:var(--muted);text-transform:none}
p{margin:0 0 10px}
.muted{color:var(--muted)}
.small{font-size:15px}
.card{background:var(--card);border:1px solid var(--edge);border-radius:var(--radius);padding:16px;margin:0 0 14px;box-shadow:var(--shadow)}
.btn{display:flex;align-items:center;justify-content:center;gap:8px;width:100%;min-height:56px;padding:0 18px;border-radius:var(--radius);border:2px solid var(--primary);background:var(--primary);color:var(--primary-fg);font-weight:800;font-size:19px;cursor:pointer;text-align:center}
.btn.secondary{background:transparent;color:var(--fg);border-color:var(--border)}
.btn.small{min-height:48px;font-size:16px;width:auto;padding:0 14px}
.btn.hero{min-height:72px;font-size:22px}
.btn[disabled],.btn[aria-disabled="true"]{opacity:.45;cursor:not-allowed}
.stats{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.stat{border:1px solid var(--edge);border-radius:10px;padding:10px 12px;background:var(--bg)}
.stat .v{font-size:26px;font-weight:800;line-height:1.1;font-variant-numeric:tabular-nums}
.stat .l{font-size:14px;color:var(--muted)}
.stat.wide{grid-column:1/-1}
.unit{font-size:14px;font-weight:600;color:var(--muted)}
.tag{display:inline-block;font-size:13px;font-weight:700;padding:2px 8px;border-radius:999px;border:1.5px solid var(--border);color:var(--fg);background:transparent;vertical-align:middle}
.tag.ex{border-color:var(--warn-edge);background:var(--warn-bg);color:var(--warn-fg)}
.tag.dir{border-color:var(--warn-edge);background:var(--warn-bg);color:var(--warn-fg)}
.tag.miss{border-style:dashed;color:var(--muted)}
.trip{display:flex;gap:12px;align-items:flex-start;padding:12px 0;border-top:1px solid var(--edge)}
.trip:first-child{border-top:0}
.trip .ic{flex:none;width:44px;height:44px;border-radius:10px;background:var(--primary-soft);color:var(--primary-soft-fg);display:flex;align-items:center;justify-content:center}
.trip .body{flex:1;min-width:0}
.trip .t{font-weight:700}
.trip .r{text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}
.neg{color:var(--bad);font-weight:700}
.pos{color:var(--good);font-weight:700}
/* Steps */
.steps{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;margin:0 0 14px;padding:0;list-style:none}
.steps li{border-top:6px solid var(--edge);padding-top:6px;font-size:14px;font-weight:600;color:var(--muted)}
.steps li[aria-current="step"]{border-color:var(--primary);color:var(--fg);font-weight:800}
.steps li.done{border-color:var(--primary)}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px;min-width:0}
.tile{min-width:0;position:relative;display:flex;flex-direction:column;align-items:flex-start;justify-content:flex-start;gap:6px;min-height:92px;padding:12px;border-radius:var(--radius);border:2px solid var(--border);background:var(--card);cursor:pointer;text-align:left}
.tile .name{overflow-wrap:anywhere;hyphens:auto;font-weight:800;font-size:17px;line-height:1.2}
.tile .sub{font-size:13.5px;color:var(--muted);line-height:1.25}
.tile svg{color:var(--primary)}
.tile[aria-pressed="true"]{border-color:var(--primary);border-width:3px;padding:11px;background:var(--primary-soft);color:var(--primary-soft-fg)}
.tile[aria-pressed="true"] .sub{color:var(--primary-soft-fg)}
.tile[aria-pressed="true"]::after{content:"✓";position:absolute;top:6px;right:10px;font-weight:900;font-size:20px}
.tile[aria-disabled="true"]{border-style:dashed;background:var(--bg);cursor:not-allowed}
.tile[aria-disabled="true"] svg,.tile[aria-disabled="true"] .name{opacity:.6}
.tile.wide{grid-column:1/-1;min-height:72px;flex-direction:row;align-items:center;gap:12px}
.notice{border-radius:10px;border:2px solid var(--warn-edge);background:var(--warn-bg);color:var(--warn-fg);padding:10px 12px;margin:0 0 12px;font-size:16px}
.notice.bad{border-color:var(--bad);background:var(--bad-bg);color:var(--bad-fg)}
.field label,.lbl{display:block;font-weight:700;margin:0 0 6px}
.inp{display:flex;align-items:stretch;border:2px solid var(--border);border-radius:var(--radius);background:var(--card);overflow:hidden}
.inp input{flex:1;min-width:0;min-height:60px;border:0;background:transparent;padding:0 14px;font-size:24px;font-weight:700;font-variant-numeric:tabular-nums}
.inp input:focus-visible{outline:none}
.inp:focus-within{outline:3px solid var(--focus);outline-offset:2px}
.inp .u{display:flex;align-items:center;padding:0 14px;font-weight:700;color:var(--muted);border-left:2px solid var(--edge)}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin-top:8px}
.chip{min-height:48px;min-width:56px;padding:0 14px;border-radius:999px;border:2px solid var(--border);background:transparent;font-weight:700;cursor:pointer}
.segcard{border:1px solid var(--edge);border-radius:var(--radius);padding:14px;margin:0 0 12px;background:var(--card)}
.segtop{display:flex;align-items:center;gap:10px;margin:0 0 10px}
.segtop .n{flex:1;font-weight:800}
.modechip{display:flex;align-items:center;gap:10px;min-height:48px;padding:6px 10px;border-radius:10px;background:var(--primary-soft);color:var(--primary-soft-fg);font-weight:800;flex:1}
.switch{display:flex;align-items:center;gap:12px;min-height:56px;width:100%;padding:8px 14px;border:2px solid var(--border);border-radius:var(--radius);background:var(--card);cursor:pointer;text-align:left;font-weight:700}
.switch .track{flex:none;width:52px;height:30px;border-radius:999px;border:2px solid var(--border);position:relative;background:transparent}
.switch .track::after{content:"";position:absolute;top:3px;left:3px;width:20px;height:20px;border-radius:50%;background:var(--border);transition:left .12s}
.switch[aria-checked="true"] .track{background:var(--primary);border-color:var(--primary)}
.switch[aria-checked="true"] .track::after{left:25px;background:var(--primary-fg)}
.radios{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.radios button{min-height:56px;border:2px solid var(--border);border-radius:var(--radius);background:var(--card);font-weight:700;cursor:pointer}
.radios button[aria-checked="true"]{border-color:var(--primary);border-width:3px;background:var(--primary-soft);color:var(--primary-soft-fg)}
.actionbar{position:fixed;left:0;right:0;bottom:0;z-index:5;background:var(--card);border-top:1px solid var(--edge);padding:10px 12px calc(10px + env(safe-area-inset-bottom))}
.actionbar .in{max-width:560px;margin:0 auto;display:grid;grid-template-columns:1fr 1.6fr;gap:10px}
.actionbar .hint{grid-column:1/-1;font-size:14px;color:var(--muted);margin:0;min-height:1.2em}
.tabbar{position:fixed;left:0;right:0;bottom:0;z-index:5;background:var(--card);border-top:1px solid var(--edge);padding-bottom:env(safe-area-inset-bottom)}
.tabbar .in{max-width:560px;margin:0 auto;display:grid;grid-template-columns:1fr 1fr}
.tabbar button{min-height:60px;border:0;background:transparent;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;font-weight:700;font-size:14px;cursor:pointer;border-top:4px solid transparent;color:var(--muted)}
.tabbar button[aria-current="page"]{color:var(--fg);border-top-color:var(--primary)}
.big{font-size:56px;line-height:1;font-weight:900;letter-spacing:-.02em;font-variant-numeric:tabular-nums}
.bars{margin:14px 0 4px}
.barrow{margin:0 0 12px}
.barrow .cap{display:flex;justify-content:space-between;gap:8px;font-weight:700;font-size:15px;margin:0 0 4px}
.bar{height:22px;border-radius:6px;background:var(--bg);border:1px solid var(--edge);overflow:hidden}
.bar i{display:block;height:100%;min-width:2px}
.save{display:flex;align-items:center;gap:10px;border-radius:10px;padding:12px;font-weight:800;font-size:18px}
.save.ok{background:var(--primary-soft);color:var(--primary-soft-fg)}
.save.bad{background:var(--bad-bg);color:var(--bad-fg)}
.toast{position:fixed;left:12px;right:12px;bottom:84px;z-index:9;max-width:536px;margin:0 auto;background:var(--fg);color:var(--bg);padding:12px 16px;border-radius:10px;font-weight:700}
table.src{width:100%;border-collapse:collapse;font-size:15px}
table.src th{text-align:left;padding:8px;border-bottom:2px solid var(--border);vertical-align:bottom;font-size:13.5px;color:var(--muted)}
table.src td{padding:8px;border-bottom:1px solid var(--edge);vertical-align:top}
table.src tr.miss td{color:var(--muted)}
@media (max-width:700px){
  table.src,table.src tbody,table.src tr,table.src td{display:block;width:100%}
  table.src thead{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
  table.src tr{border:1px solid var(--edge);border-radius:var(--radius);padding:10px 12px;margin:0 0 12px;background:var(--card)}
  table.src td{border:0;padding:3px 0}
  table.src td[data-l]::before{content:attr(data-l) ": ";font-weight:700;color:var(--muted)}
  table.src td.mode{font-size:18px;font-weight:800;padding-bottom:6px}
  table.src td.mode::before{content:""}
}
@media (min-width:701px){.shell{max-width:980px}.actionbar .in,.tabbar .in{max-width:980px}main{padding-left:24px;padding-right:24px}.narrow{max-width:560px}}
details summary{min-height:48px;display:flex;align-items:center;cursor:pointer;font-weight:700}
ul.rules{padding-left:20px;margin:0 0 10px}
ul.rules li{margin:0 0 8px}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>

/* ===== Beregning (samme regler som calc/src/calc.ts, ingen avrunding) ===== */
function calcTrip(segs, ret){
  const mult = ret ? 2 : 1; let dist = 0, em = 0; const rows = [];
  for (const s of segs){ const d = s.km * mult, f = perPkm(s.mode); dist += d; em += d * f; rows.push({mode:s.mode, km:d, f, kg:d*f}); }
  const base = dist * REFKM; return {dist, em, base, save: base - em, rows};
}
function calcHome(km, ret){ const av = km * (ret ? 2 : 1); const base = av * REFKM; return {dist:0, avoided:av, em:0, base, save:base, rows:[]}; }

/* ===== Format ===== */
let S; // state

const fmtKg = n => (n < 0 ? "−" : "") + Math.abs(n).toLocaleString(loc(), {minimumFractionDigits:2, maximumFractionDigits:3});
const fmtKm = n => n.toLocaleString(loc(), {maximumFractionDigits:3});
const fmtF = n => n.toLocaleString(loc(), {maximumFractionDigits:6});
const parseNum = s => { const t = String(s).trim().replace(",", "."); return t === "" ? NaN : Number(t); };
const esc = s => String(s).replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const t = () => T[S.lang];

/* ===== State ===== */
function exampleTrips(){
  const mk = (id, key, kind, segs, ret, commute) => {
    const r = kind === "home" ? calcHome(commute, ret) : calcTrip(segs.map(s=>({mode:s[0],km:s[1]})), ret);
    return {id, example:true, key, kind, segs:(segs||[]).map(s=>({mode:s[0],km:s[1]})), ret, commute, r};
  };
  return [
    mk("e1","ex1","trip",[["electric_car",24]],true),
    mk("e2","ex2","trip",[["city_bus",6]],false),
    mk("e3","ex3","trip",[["airplane",400]],false),
    mk("e4","ex4","home",null,true,15)
  ];
}

/* ===== Render ===== */
function render(focus){
  const doc = document.documentElement; doc.lang = S.lang; doc.dataset.theme = S.theme;
  document.title = "Carboncut – " + (S.lang==="nb" ? "skisser v1 (klikkbar prototype)" : "sketches v1 (clickable prototype)");
  let body, bar = "";
  if (S.view==="home"){ body = viewHome(); bar = tabbar(); }
  else if (S.view==="method"){ body = viewMethod(); bar = tabbar(); }
  else { body = S.step===1?viewStep1():S.step===2?viewStep2():viewStep3(); bar = actionbar(); }
  document.getElementById("root").innerHTML = header() + body + bar + (S.toast?`<div class="toast" role="status">${esc(S.toast)}</div>`:"");
  if (focus){ const h = document.getElementById("h"); if (h){ h.setAttribute("tabindex","-1"); h.focus({preventScroll:true}); window.scrollTo(0,0);} }
}
function go(view, step){ S.view = view; if (step) S.step = step; S.confirmClear = false; render(true); }
function updateStep2Live(){
  const L = t(); const btn = document.getElementById("next2"), hint = document.getElementById("hint"), tk = document.getElementById("totkm");
  const ok = segValid();
  if (btn){ btn.disabled = !ok; if (ok) btn.removeAttribute("aria-describedby"); else btn.setAttribute("aria-describedby","hint"); }
  if (hint) hint.textContent = ok ? "" : (S.kind==="home" ? L.needKmHome : L.needKm);
  if (tk) tk.textContent = totalKmText();
}

document.addEventListener("click", e => {
  const el = e.target.closest("[data-a]"); if (!el) return;
  const a = el.dataset.a, v = el.dataset.v, i = +el.dataset.i; const L = t();
  if (a==="lang"){ S.lang = v; render(); }
  else if (a==="theme"){ S.theme = S.theme==="dark"?"light":"dark"; render(); }
  else if (a==="go"){ resetWizard(); go(v); }
  else if (a==="method"){ e.preventDefault(); S.view="method"; render(true); }
  else if (a==="start"){ resetWizard(); S.view="wizard"; S.step=1; render(true); }
  else if (a==="cancel"){ resetWizard(); go("home"); }
  else if (a==="cancelLeg"){ S.segs.pop(); S.active = S.segs.length-1; S.notice=null; S.step=2; render(true); }
  else if (a==="pick"){
    if (v==="home_office"){ S.kind="home"; S.segs=[{mode:null,km:""}]; S.active=0; S.notice=null; S.step=2; render(true); return; }
    if (!isOk(v)){ S.notice = L.missingMsg(modeName(v,S.lang)); render(); const h=document.getElementById("h"); if(h) h.focus({preventScroll:true}); return; }
    S.kind="trip"; S.segs[S.active].mode = v; S.notice = null; S.step = 2; render(true);
  }
  else if (a==="next"){ if (el.disabled) return; if (S.step===1){ S.step=2; } else if (S.step===2){ S.step=3; } render(true); }
  else if (a==="prev"){ S.step = Math.max(1, S.step-1); S.notice=null; if (S.step===1) S.active = Math.min(S.active, S.segs.length-1); render(true); }
  else if (a==="change"){ S.active = i; S.notice=null; S.step = 1; render(true); }
  else if (a==="rm"){ S.segs.splice(i,1); S.active = 0; render(); }
  else if (a==="addleg"){ S.segs.push({mode:null,km:""}); S.active = S.segs.length-1; S.kind="trip"; S.step=1; S.notice=null; render(true); }
  else if (a==="ret"){ S.ret = !S.ret; render(); const b=document.querySelector('[data-a="ret"]'); if(b) b.focus(); }
  else if (a==="avoided"){ S.avoided = v; render(); }
  else if (a==="add" || a==="zero"){
    const cur = S.kind==="home" ? parseNum(S.commute) : parseNum(S.segs[i].km); const base = cur>0?cur:0;
    const nv = a==="zero" ? "" : String(Math.round((base + +v)*1000)/1000).replace(".", S.lang==="nb"?",":".");
    if (S.kind==="home") S.commute = nv; else S.segs[i].km = nv;
    const inp = document.getElementById("km"+(S.kind==="home"?0:i)); if (inp) inp.value = nv; updateStep2Live();
  }
  else if (a==="save"){
    const r = currentResult();
    S.trips.unshift({id:"t"+Date.now(), example:false, kind:S.kind, segs:S.kind==="trip"?S.segs.map(s=>({mode:s.mode,km:parseNum(s.km)})):[], ret:S.kind==="home"?S.avoided==="return":S.ret, commute:parseNum(S.commute), desc:S.desc.trim(), r});
    resetWizard(); S.view="home"; S.toast = L.saved; render(true); setTimeout(()=>{ S.toast=null; if (S.view==="home") render(); }, 2600);
  }
  else if (a==="clear"){
    if (!S.confirmClear){ S.confirmClear = true; render(); setTimeout(()=>{ if (S.confirmClear){ S.confirmClear=false; if (S.view==="home") render(); } }, 4000); }
    else { S.trips = []; S.confirmClear = false; render(); }
  }
});
document.addEventListener("input", e => {
  const el = e.target; if (!el.dataset || !el.dataset.in) return;
  if (el.dataset.in==="km"){ S.segs[+el.dataset.i].km = el.value; updateStep2Live(); }
  else if (el.dataset.in==="commute"){ S.commute = el.value; updateStep2Live(); }
  else if (el.dataset.in==="desc"){ S.desc = el.value; }
});
window.addEventListener("error", e => { document.title = "JSERROR: " + e.message; });
render();
</script>
</body>
</html>
